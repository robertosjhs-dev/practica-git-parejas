<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
     let numero_Secreto = 8
     let numero_Usuario = Number(prompt("Elige un número de 1 al 10"))

    if(numero_Usuario === numero_Secreto){
        alert("¡Felicidades! Has adivinado el número secreto");
    } if(numero_Usuario != numero_Secreto){
        alert("El número que has elegido es no es el número secreto");
    }  else if (numero_Usuario > numero_Secreto) {
        alert("El número introducido es mayor que el número secreto");
    }

    </script>
</body>
</html>
