<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        let nombreUsuario = prompt("Introduce tu nombre");
        let precioCompra = Number(prompt("Introduce el precio de la compra"));
        let precioFinal = null

        if (precioCompra >= 100) {
            precioFinal = precioCompra * 0.90;
        }else{
            precioFinal = precioCompra;
            alert("Hola " + nombreUsuario + ", el precio final de tu compra es: " + precioFinal);
        }

    </script>
</body>
</html>
